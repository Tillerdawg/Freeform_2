# Every push to main: install, test, build, and publish the app to GitHub Pages.
# A failing test stops the deploy, so a broken build never replaces the live site.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Smoke test: click through the real app in a browser (the screenshot script drives every screen in the guide).
      # It catches what unit tests can't, like a screen that crashes or a button that's gone.
      # Use the Chrome GitHub's runner already has. Downloading Playwright's own Chrome needs Ubuntu's package servers
      # for fonts, and when those can't be reached the deploy fails for nothing to do with the code (2026-11-11).
      - run: npm i --no-save playwright
      - run: |
          if command -v google-chrome >/dev/null; then echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - run: node scripts/screenshots.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
