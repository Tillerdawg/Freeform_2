<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Freeform</title>
    <meta name="description" content="Free, open-source drill design for marching bands and drum corps." />
    <meta name="theme-color" content="#1d2a1f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Freeform" />
    <style>
      :root { --bg: #1d2a1f; --bg-deep: #182419; --surface: #22302a; --surface-2: #2b3b2f; --line: #33443a; --line-strong: #44594a; --muted: #6b8270; --green: #3d6b4a; --green-line: #7cc08b; --text: #e9f0ea; --gold: #ffd166; --warn: #f5c518; --warn-line: #5a4a1a; --danger: #ff8080; --step-red: #ff4d4d; --danger-bg: #5a2b2b; --danger-line: #a04848; --blue: #5ad1ff; --turf: #357842; } /* = src/ui/palette.ts */
      html { touch-action: manipulation; } /* no double-tap page zoom on buttons; the field has its own pinch */
      html, body, #root { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      /* viewport-fit=cover makes iOS report its status bar, home indicator and notch as safe-area insets (without it they
         read 0 while the page still runs behind the home indicator); everything stays inside them. 0 on computers. */
      #root { box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      /* With no status bar on top (an iPhone Duo on its side puts the clock at the right), the top bar would sit flush with
         the edge while the home-bar margin stays below: keep a little room up top on touch screens. */
      @media (pointer: coarse) { #root { padding-top: max(env(safe-area-inset-top), 12px); } }
      /* In the editor, the top margin matches the bottom one (Jason: visual balance on an iPhone Duo on its side, whose clock
         sits at the right): the home-bar margin plus the timeline's 12 px padding. The performer view keeps its height. */
      @media (pointer: coarse) { body:not(.performer) #root { padding-top: max(env(safe-area-inset-top), calc(env(safe-area-inset-bottom) + 12px)); } }
      /* Buttons and fields: one calm style everywhere. Heights stay within the fixed rows (top bar 40, toolbar 44, timeline 30). */
      button { font: inherit; font-size: 13px; line-height: 18px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 6px;
        padding: 3px 10px; cursor: pointer; transition: background .12s, border-color .12s, box-shadow .12s; }
      @media (hover: hover) { button:hover:not(:disabled) { background: var(--line); border-color: var(--muted); } } /* a tapped button on a touch screen would keep its hover look */
      button:active:not(:disabled) { background: var(--surface); }
      button:disabled { opacity: .45; cursor: default; }
      button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
      button[aria-pressed=true], button[aria-checked=true] { background: var(--gold); border-color: var(--gold); color: var(--bg-deep); font-weight: 600; }
      button.icon { padding: 4px 7px; }
      button > svg:only-child { margin: 0 auto; } /* icons are blocks: center them when the button is wider (44 px on touch) */
      button.primary { background: var(--green); border-color: var(--green-line); }
      @media (hover: hover) { button.danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger-line); } }
      select, input:not([type=radio]):not([type=checkbox]):not([type=range]), textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--bg-deep);
        border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 6px; }
      select { padding-right: 4px; }
      /* Drill toolbar under the top bar: fixed height, never wraps (see CLAUDE.md). */
      .toolbar button { padding-left: 8px; padding-right: 8px; }
      .toolbar { display: flex; align-items: center; gap: 4px; height: 44px; box-sizing: border-box; flex-shrink: 0; padding: 0 0 0 12px; white-space: nowrap; overflow-x: auto; scrollbar-width: none;
        border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg-deep); position: relative; z-index: 5; }
      .toolbar + .toolbar { border-top: none; padding-right: 12px; } /* the second toolbar row */
      @media (pointer: coarse) and (max-width: 820px) { .tb-long { display: none; } } /* "Snap to grid" → "Snap": the row fits an upright iPad mini */
      /* Narrower still (an open iPhone Duo, 669 px): Select / Add / Delete, "Reset", no "Freeform" title, snugger padding.
         Buttons stay 44 px tall, and screen readers still hear the full names. */
      @media (pointer: coarse) and (max-width: 700px) { .tb-long-sm { display: none !important; } .toolbar button { padding-left: 6px; padding-right: 6px; } }
      .toolbar > * { flex: none; }
      .tb-field { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; opacity: .9; }
      .tb-field select { max-width: 130px; }
      .tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
      .tb-note { font-size: 12px; color: var(--warn); overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
      /* Touch screens (iPad): Apple's 44 px minimum for anything you tap, 16 px text in fields (smaller makes iOS zoom in on
         focus), and taller fixed rows to hold them (top bar 56, toolbar 56, timeline row 48). Set once per device. */
      @media (pointer: coarse) {
        button, select, input:not([type=radio]):not([type=checkbox]):not([type=range]) { min-height: 44px; box-sizing: border-box; font-size: 15px; }
        button, input[type=color] { min-width: 44px; }
        summary { min-height: 44px; display: flex; align-items: center; gap: 6px; }
        select, input, textarea { font-size: 16px !important; }
        input[type=checkbox], input[type=radio] { width: 22px; height: 22px; }
        button { padding-left: 12px; padding-right: 12px; }
        .toolbar { height: 56px; }
        .tb-field, .tb-note { font-size: 14px; }
        .tb-sep { height: 32px; }
      }
      .tb-pinned { position: sticky; right: 0; margin-left: auto; display: inline-flex; gap: 4px; padding: 0 12px 0 8px; background: var(--bg-deep); box-shadow: -10px 0 8px var(--bg-deep); }
      .tb-menu { position: relative; display: inline-block; }
      .tb-menu .caret { font-size: 10px; opacity: .7; }
      .tb-menu-panel { position: fixed; min-width: 180px; max-width: 340px; padding: 8px; display: flex; flex-direction: column;
        gap: 4px; align-items: stretch; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
        white-space: normal; font-size: 13px; z-index: 20; max-height: 70vh; overflow-y: auto; }
      .tb-menu-panel > button { text-align: left; }
      @media screen { #print-root { display: none; } }
      /* The page itself never scrolls (panels scroll inside themselves): pinned, so iOS can't leave it scrolled after
         rotating or after lifting a text box above the keyboard, which pushed the phone view up under the status bar. */
      @media screen { html { overflow: hidden; } body { position: fixed; inset: 0; overflow: hidden; } }
      /* Performer view: portrait-first phone layout; side by side in landscape. */
      .perform { display: flex; flex-direction: column; height: 100%; }
      /* Phone header: the show's title on its own line (full contrast, up to two lines), then the big "who are you" button. */
      /* Room at the top: newer iOS blurs a band just below the status bar (over the page), which blurred the title. */
      .perform-bar { display: flex; flex-direction: column; gap: 6px; padding: 24px 12px 8px; flex-shrink: 0; }
      .perform-titlebar { display: flex; align-items: center; gap: 8px; }
      .perform-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
      .who-button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; font-size: 17px; text-align: left; }
      .who-current { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* The "who are you" sheet: whole screen on a phone, a centered panel on anything wider. */
      .who-sheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); background: var(--bg); }
      @media (min-width: 600px) and (min-height: 600px) { .who-sheet { inset: 5vh auto auto 50%; transform: translateX(-50%); width: min(440px, 92vw); height: 90vh; box-sizing: border-box;
        border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); } }
      .who-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 17px; }
      .who-sheet input[type=search] { width: 100%; box-sizing: border-box; min-height: 44px; margin: 6px 0 8px; font-size: 17px; }
      .who-list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .who-list h3 { margin: 14px 0 6px; font-size: 14px; }
      .who-list button { display: block; width: 100%; min-height: 44px; margin: 0 0 6px; font-size: 17px; text-align: left; }
      .who-list p { font-size: 16px; }
      /* Short screens (a phone on its side, where the keyboard takes most of the height): title, search and Cancel share one
         row, and names run in columns, so more of the band shows above the keyboard. */
      @media (max-height: 500px) {
        .who-sheet { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr; column-gap: 12px; align-items: center; }
        .who-head { display: contents; }
        .who-head strong { grid-area: 1 / 1; }
        .who-head button { grid-area: 1 / 3; }
        .who-sheet input[type=search] { grid-area: 1 / 2; margin: 6px 0; }
        .who-list { grid-area: 2 / 1 / 3 / 4; align-self: stretch; }
        .who-list section { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); column-gap: 8px; }
        .who-list h3 { grid-column: 1 / -1; }
      }
      .perform-field { position: relative; flex: 1; min-height: 0; }
      .perform-toggles { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
      .perform-toggles button { font-size: 14px; padding: 6px 10px; }
      /* Fixed height: content changes count by count, and a resizing field would flash. Scrolls if needed. */
      .perform-info { padding: 8px 12px; flex-shrink: 0; font-size: 15px; height: 230px; box-sizing: border-box; overflow-y: auto; }
      .perform-info p { margin: 4px 0; }
      .perform-k { display: block; font-size: 12px; opacity: 0.7; }
      .perform-set { font-size: 16px; }
      .perform-controls { padding: 6px 12px 10px; flex-shrink: 0; border-top: 1px solid var(--line); }
      .perform-controls input[type=range] { width: 100%; height: 32px; }
      .perform-sets { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; height: 44px; align-items: center; scrollbar-width: none; }
      .perform-sets[data-more=right] { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
      .perform-sets[data-more=left] { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); }
      .perform-sets[data-more=both] { -webkit-mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
      .perform-sets button { flex: none; min-width: 40px; height: 36px; font-size: 16px; border: 2px solid transparent; }
      .perform-sets button[aria-pressed=true] { border-color: var(--gold); font-weight: bold; }
      .perform-buttons { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
      .perform-empty { padding: 24px; max-width: 32em; margin: auto; }
      .perform-around { margin: 2px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 14px; }
      @media screen and (orientation: landscape) {
        .perform { display: grid; grid-template-columns: 1fr minmax(260px, 34%); grid-template-rows: auto 1fr auto auto; }
        .perform-bar { grid-column: 1 / -1; }
        .perform-field { grid-row: 2 / 5; }
        .perform-info, .perform-controls { grid-column: 2; overflow-y: auto; }
        .perform-info { height: auto; }
        .perform-toggles { position: static; flex-wrap: wrap; margin: 0 0 8px; }
      }
      @media print {
        html, body { height: auto; background: #fff; color: #000; }
        #root { display: none !important; }
        .dot-page { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 10.15in; break-after: page; }
        .dot-card { border: 1px dashed #999; padding: 0.15in; overflow: hidden; font-size: 8pt; }
        .dot-card header { display: flex; gap: 6px; align-items: baseline; margin-bottom: 4px; }
        .dot-card header strong { font-size: 14pt; }
        .dot-card .dot-name { font-size: 11pt; font-weight: 600; }
        .dot-card .dot-show { margin-left: auto; color: #555; font-size: 7.5pt; }
        .dot-card table { width: 100%; border-collapse: collapse; }
        .dot-card th { text-align: left; border-bottom: 1px solid #000; font-size: 7.5pt; padding-right: 5px; }
        .dot-card td { padding: 1px 5px 1px 0; border-bottom: 1px solid #ddd; vertical-align: top; }
        .dot-card td:nth-child(-n+2), .dot-card th:nth-child(-n+2) { width: 1.6em; white-space: nowrap; }
        .dot-card td:nth-child(3) { width: 52%; }
        .dot-card table.with-meas td:nth-child(3) { width: auto; white-space: nowrap; }
        .dot-card table.with-meas td:nth-child(4) { width: 46%; }
        .chart-page { break-after: page; }
        .chart-page header { display: flex; justify-content: space-between; font-size: 13pt; margin-bottom: 6px; }
        .chart-page img { width: 100%; display: block; }
        .chart-note { font-size: 12pt; margin: 10px 0 0; white-space: pre-wrap; }
        .dot-card tr.has-cue td { border-bottom: none; }
        .dot-card tr.cue td { font-style: italic; padding-top: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <!-- Too old to run Freeform (an iPad mini 2 on iOS 12 showed a blank page): say so. Old-style JavaScript on purpose,
         so the browsers it's for can run it. Pointer events (iOS 13) drive every tap and drag; regex lookbehind arrived with
         Safari 16.4, the version the app is built for (Vite's default target), so it stands in for "can read the code". -->
    <script>
      (function () {
        var ok = !!window.PointerEvent;
        try { new RegExp('(?<=a)b'); } catch (e) { ok = false; }
        if (ok) return;
        var d = document.createElement('div');
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;padding:32px 24px;overflow:auto;' +
          'background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,sans-serif;';
        d.innerHTML = '<h1 style="font-size:24px;margin:0 0 12px">Freeform needs a newer browser</h1>' +
          '<p style="margin:0 0 12px;max-width:34em">This browser is too old to run Freeform. It needs iPadOS or iOS 16.4 or later ' +
          '(any iPad from 2017 on), or a current version of Chrome, Edge, Firefox or Safari on a computer.</p>' +
          '<p style="margin:0;max-width:34em;opacity:.8">Shows and links you open on a newer device work the same there.</p>';
        document.body.appendChild(d);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
