        gap: 4px; align-items: stretch; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
        white-space: normal; font-size: 13px; z-index: 20; max-height: 70vh; overflow-y: auto; }

      @media screen { #print-root { display: none; } }
      /* The page itself never scrolls (panels scroll inside themselves): pinned, so iOS can't leave it scrolled after

      @media screen { html { overflow: hidden; } body { position: fixed; inset: 0; overflow: hidden; } }
      /* Performer view: portrait-first phone layout; side by side in landscape. */

      .perform-titlebar { display: flex; align-items: center; gap: 8px; }

      .perform-add > button { justify-self: start; }
      .perform-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

        border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); } }

      .who-sheet input[type=search] { width: 100%; box-sizing: border-box; min-height: 44px; margin: 6px 0 8px; font-size: 17px; }
      .who-list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

      .perform-view { flex: none; font-size: 14px; padding: 6px 10px; min-height: 44px; } /* Follow my dot, From the press box: beside the title and the who button, not over the field */

        .chart-page header { display: flex; justify-content: space-between; font-size: 13pt; margin-bottom: 6px; }
        .chart-page img { width: 100%; display: block; }
        .chart-note { font-size: 12pt; margin: 10px 0 0; white-space: pre-wrap; }
        .dot-card tr.has-cue td { border-bottom: none; }
        .dot-card tr.cue td { font-style: italic; padding-top: 0; }
        .dot-page.single { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .dot-page.single .dot-card { border: none; padding: 0; font-size: 10.5pt; }
        .dot-page.single .dot-card header strong { font-size: 20pt; }
        .dot-page.single .dot-card .dot-name { font-size: 15pt; }
        .dot-page.single .dot-card .dot-show { font-size: 10pt; }
        .dot-page.single .dot-card th { font-size: 10pt; }
        .dot-page.single .dot-card td { padding: 3px 8px 3px 0; }
        .dot-page.single .dot-card td:nth-child(3), .dot-page.single .dot-card table.with-meas td:nth-child(4) { width: auto; }
        .dot-page.single .dot-card td.notes { width: 30%; font-style: italic; }
        .dot-page.pics .dot-card td.notes { width: 20%; }
        .dot-page.pics .dot-card td.pic { width: 1.3in; padding: 2px 0; }
        .dot-page.pics .dot-card td.pic img { width: 1.3in; display: block; border: 1px solid #999; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <!-- Too old to run FreeFORM (an iPad mini 2 on iOS 12 showed a blank page): say so. Old-style JavaScript on purpose,
         so the browsers it's for can run it. Pointer events (iOS 13) drive every tap and drag; regex lookbehind arrived with
         Safari 16.4, the version the app is built for (Vite's default target), so it stands in for "can read the code". -->
    <script>
      (function () {
        var ok = !!window.PointerEvent;
        try { new RegExp('(?<=a)b'); } catch (e) { ok = false; }
        if (ok) return;
        var d = document.createElement('div');
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;padding:32px 24px;overflow:auto;' +
          'background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,sans-serif;';
        d.innerHTML = '<img src="../logo.svg" alt="" width="240" style="display:block;margin:0 0 20px">' +
          '<h1 style="font-size:24px;margin:0 0 12px">FreeFORM needs a newer browser</h1>' +
          '<p style="margin:0 0 12px;max-width:34em">This browser is too old to run FreeFORM. It needs iPadOS or iOS 16.4 or later ' +
          '(any iPad from 2017 on), or a current version of Chrome, Edge, Firefox, or Safari on a computer.</p>' +
          '<p style="margin:0;max-width:34em;opacity:.8">Shows and links you open on a newer device work the same there.</p>';
        document.body.appendChild(d);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
