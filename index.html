<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freeform</title>
    <meta name="description" content="Free, open-source drill design for marching bands and drum corps." />
    <meta name="theme-color" content="#1d2a1f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Freeform" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #1d2a1f; color: #eee; font-family: system-ui, sans-serif; }
      @media screen { #print-root { display: none; } }
      /* Performer view: portrait-first phone layout; side by side in landscape. */
      .perform { display: flex; flex-direction: column; height: 100%; }
      .perform-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-shrink: 0; }
      .perform-title { margin-left: auto; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .perform-field { position: relative; flex: 1; min-height: 0; }
      .perform-toggles { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
      .perform-toggles button { font-size: 14px; padding: 6px 10px; }
      /* Fixed height: content changes count by count, and a resizing field would flash. Scrolls if needed. */
      .perform-info { padding: 8px 12px; flex-shrink: 0; font-size: 15px; height: 230px; box-sizing: border-box; overflow-y: auto; }
      .perform-info p { margin: 4px 0; }
      .perform-k { display: block; font-size: 12px; opacity: 0.7; }
      .perform-set { font-size: 16px; }
      .perform-controls { padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid #33443a; }
      .perform-controls input[type=range] { width: 100%; height: 32px; }
      .perform-buttons { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
      .perform-empty { padding: 24px; max-width: 32em; margin: auto; }
      .perform-around { margin: 2px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 14px; }
      @media screen and (orientation: landscape) {
        .perform { display: grid; grid-template-columns: 1fr minmax(260px, 34%); grid-template-rows: auto 1fr auto auto; }
        .perform-bar { grid-column: 1 / -1; }
        .perform-field { grid-row: 2 / 5; }
        .perform-info, .perform-controls { grid-column: 2; overflow-y: auto; }
        .perform-info { height: auto; }
      }
      @media print {
        html, body { height: auto; background: #fff; color: #000; }
        #root { display: none !important; }
        .dot-page { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 10.15in; break-after: page; }
        .dot-card { border: 1px dashed #999; padding: 0.15in; overflow: hidden; font-size: 8pt; }
        .dot-card header { display: flex; gap: 6px; align-items: baseline; margin-bottom: 4px; }
        .dot-card header strong { font-size: 14pt; }
        .dot-card .dot-show { margin-left: auto; color: #555; font-size: 7.5pt; }
        .dot-card table { width: 100%; border-collapse: collapse; }
        .dot-card th { text-align: left; border-bottom: 1px solid #000; font-size: 7.5pt; padding-right: 5px; }
        .dot-card td { padding: 1px 5px 1px 0; border-bottom: 1px solid #ddd; vertical-align: top; }
        .dot-card td:nth-child(-n+2), .dot-card th:nth-child(-n+2) { width: 1.6em; white-space: nowrap; }
        .dot-card td:nth-child(3) { width: 52%; }
        .dot-card table.with-meas td:nth-child(3) { width: auto; white-space: nowrap; }
        .dot-card table.with-meas td:nth-child(4) { width: 46%; }
        .chart-page { break-after: page; }
        .chart-page header { display: flex; justify-content: space-between; font-size: 13pt; margin-bottom: 6px; }
        .chart-page img { width: 100%; display: block; }
        .chart-note { font-size: 12pt; margin: 10px 0 0; white-space: pre-wrap; }
        .dot-card tr.has-cue td { border-bottom: none; }
        .dot-card tr.cue td { font-style: italic; padding-top: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
